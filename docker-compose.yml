version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: icpusdb
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: icpusdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
      build: ./backend
      container_name: backend
      restart: always
      ports:
        - "8080:8080"
      depends_on:
        - db
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/icpusdb
        SPRING_DATASOURCE_USERNAME: admin
        SPRING_DATASOURCE_PASSWORD: admin
  
  frontend:
      build: ./frontend
      container_name: frontend
      restart: always
      ports:
        - "80:80"
      depends_on:
        - backend

volumes:
  postgres_data: